<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16130F"/>
      <stop offset="1" stop-color="#0E0C0A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.72" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#FF9A1F" stop-opacity=".30"/>
      <stop offset="1" stop-color="#FF9A1F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A251F"/><stop offset="1" stop-color="#16130F"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A1F" stop-opacity=".10"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".04"/>
      <stop offset="1" stop-color="#FF9A1F" stop-opacity=".05"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- сетка -->
  <g stroke="#241F1A" stroke-width="1" opacity=".55">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M90 0v630M180 0v630M270 0v630M360 0v630M450 0v630M540 0v630M630 0v630M720 0v630M810 0v630M900 0v630M990 0v630M1080 0v630"/>
  </g>

  <!-- логотип -->
  <g transform="translate(80 74)">
    <rect x="0" y="0" width="46" height="46" rx="9" fill="none" stroke="#FF9A1F" stroke-width="2.4"/>
    <path d="M25.3 8.6 13.7 26.2h7.5L19.3 37.4l12.6-18.7h-7.4l.8-10.1Z" fill="#FF9A1F"/>
    <text x="62" y="34" font-family="Unbounded, Arial Black, sans-serif" font-size="30"
          font-weight="800" letter-spacing="1" fill="#F3EEE6">ВОЛЬ<tspan fill="#FF9A1F">ТАЖ</tspan></text>
  </g>

  <!-- заголовок -->
  <text x="80" y="300" font-family="Unbounded, Arial Black, sans-serif" font-size="72"
        font-weight="800" fill="#F3EEE6" letter-spacing="-2">Ваш компьютер</text>
  <text x="80" y="384" font-family="Unbounded, Arial Black, sans-serif" font-size="72"
        font-weight="800" fill="#F3EEE6" letter-spacing="-2">соберёт</text>
  <text x="80" y="468" font-family="Unbounded, Arial Black, sans-serif" font-size="72"
        font-weight="800" fill="#FF9A1F" letter-spacing="-2">человек</text>

  <text x="80" y="536" font-family="Onest, Segoe UI, sans-serif" font-size="25" fill="#C4B9AB">
    Сборка игровых ПК в Томске · гарантия 3 года на весь компьютер
  </text>

  <!-- корпус -->
  <g transform="translate(830 128)">
    <ellipse cx="140" cy="392" rx="150" ry="15" fill="#FF9A1F" opacity=".22"/>
    <rect x="20" y="0" width="240" height="376" rx="12" fill="url(#case)" stroke="#3A3227" stroke-width="2"/>
    <rect x="58" y="44" width="182" height="160" rx="5" fill="#1C2822" stroke="#2C4137" stroke-width="1.5"/>

    <!-- кулер -->
    <rect x="96" y="66" width="96" height="102" rx="5" fill="#23201B" stroke="#3E362B" stroke-width="1.5"/>
    <circle cx="144" cy="117" r="30" fill="#181511" stroke="#FF9A1F" stroke-opacity=".4" stroke-width="1.6"/>
    <path d="M144 117 144 92M144 117 166 130M144 117 122 130" stroke="#FF9A1F" stroke-width="7" stroke-linecap="round" opacity=".9"/>
    <circle cx="144" cy="117" r="7" fill="#2A241D" stroke="#4A4034" stroke-width="1.2"/>

    <!-- память -->
    <rect x="206" y="60" width="11" height="94" rx="3" fill="#2C241B" stroke="#4A3A26" stroke-width="1.2"/>
    <rect x="222" y="60" width="11" height="94" rx="3" fill="#2C241B" stroke="#4A3A26" stroke-width="1.2"/>
    <rect x="206" y="60" width="11" height="8" rx="3" fill="#FF9A1F"/>
    <rect x="222" y="60" width="11" height="8" rx="3" fill="#FF9A1F"/>

    <!-- видеокарта -->
    <rect x="56" y="232" width="186" height="56" rx="5" fill="#241E17" stroke="#453A2C" stroke-width="1.5"/>
    <rect x="62" y="280" width="174" height="5" rx="2.5" fill="#FF9A1F"/>
    <circle cx="112" cy="258" r="19" fill="#191510" stroke="#7A6444" stroke-opacity=".5" stroke-width="1.4"/>
    <path d="M112 258 112 241M112 258 127 267M112 258 97 267" stroke="#7A6444" stroke-width="5" stroke-linecap="round"/>
    <circle cx="186" cy="258" r="19" fill="#191510" stroke="#7A6444" stroke-opacity=".5" stroke-width="1.4"/>
    <path d="M186 258 186 241M186 258 201 267M186 258 171 267" stroke="#7A6444" stroke-width="5" stroke-linecap="round"/>

    <!-- блок питания -->
    <rect x="54" y="316" width="188" height="44" rx="5" fill="#1C1915" stroke="#3A3227" stroke-width="1.5"/>

    <!-- фронтальные вентиляторы -->
    <g>
      <circle cx="42" cy="70" r="19" fill="#181511" stroke="#FF9A1F" stroke-opacity=".38" stroke-width="1.4"/>
      <path d="M42 70 42 54M42 70 56 79M42 70 28 79" stroke="#FF9A1F" stroke-width="5" stroke-linecap="round" opacity=".9"/>
      <circle cx="42" cy="164" r="19" fill="#181511" stroke="#FF9A1F" stroke-opacity=".38" stroke-width="1.4"/>
      <path d="M42 164 42 148M42 164 56 173M42 164 28 173" stroke="#FF9A1F" stroke-width="5" stroke-linecap="round" opacity=".9"/>
      <circle cx="42" cy="258" r="19" fill="#181511" stroke="#FF9A1F" stroke-opacity=".38" stroke-width="1.4"/>
      <path d="M42 258 42 242M42 258 56 267M42 258 28 267" stroke="#FF9A1F" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    </g>

    <!-- стекло -->
    <rect x="20" y="0" width="240" height="376" rx="12" fill="url(#glass)" stroke="#4B4133" stroke-width="2"/>
    <path d="M42 358 246 26" stroke="#FFFFFF" stroke-opacity=".05" stroke-width="30"/>
    <circle cx="248" cy="14" r="3.5" fill="#FF9A1F"/>
  </g>
</svg>
